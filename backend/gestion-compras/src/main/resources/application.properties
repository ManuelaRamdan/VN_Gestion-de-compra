spring.application.name=gestion-compras

#spring.config.import=optional:file:../../.env
spring.config.import=optional:file:src/main/resources/local.properties

# ===============================
# 1. Configuraci\u00f3n PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:gestioncompra}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# 2. Configuraci\u00f3n JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# ===============================
# 3. Logs
# ===============================
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.jpa=INFO
logging.level.com.gestionCompra.gestion_compras=INFO

# ===============================
# 4. Puerto servidor
# ===============================
server.port=${SERVER_PORT:8081}

# ===============================
# 5. Jackson
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false

# ===============================
# 6. Variables del Entorno / .env
# ===============================
config.jwt.secret=${JWT_SECRET}
pdf.storage.path=${PDF_STORAGE_PATH:./pdfs_locales}
#pdf.storage.path=C:/gestion_compras/pdfs_locales

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.cookie.secure=${APP_COOKIE_SECURE:true}